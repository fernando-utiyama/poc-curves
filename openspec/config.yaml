schema: spec-driven

context: |
  PROJETO: poc-curvas — especificacao e codigo transcrito da Plataforma de Curvas de
  Tesouraria/Risco. Alvo produtivo em Azure (AKS, Azure SQL, Kafka, Blob Storage, Entra ID).
  O codigo dos servicos e transcrito do sistema real, com pacote br.com.poc.

  SERVICOS (cada um projeto independente, com docker/ proprio):
  - services/conector (Node/TS): obtem o TaxaSwap.txt da B3, guarda no Blob, publica no Kafka.
  - services/processor (acts-srv-curvas-processor): consome o Kafka, grava o dado bruto
    (tBtrsCurvaPrimr, tAnbmaCurvaPrimr, tBbergCurvaPrimr) e avisa o engine (POST /api/v1/cargas).
  - services/engine (acts-srv-tcen-curvas-engine): constroi as curvas, grava tDadoVertcCurva
    (curva construida) e tDadoCurva (interpolada por dia corrido); consulta, simulacao, auditoria.
  - services/orchestrator: agenda tarefas, dispara o conector e a construcao por data no engine.
  - services/curves (acts-srv-curvas): cadastro de provedores e curvas, ligacoes, configuracao,
    painel, edicao manual de pontos e do bruto B3.
  - services/curve-bff e web/curve-web-ui: BFF e front Angular (BFF a transcrever).

  PRIMEIRO OBJETIVO (curvas a entregar primeiro):
  - Taxa Swap B3: DIxPRE, DCL (cupom limpo de dolar), PTAX, DPL (cupom limpo DI x IPCA), IBOVESPA
  - NTN-B (ANBIMA)
  - SOFR (Bloomberg)

  BANCO:
  - Schema real: db/migration/001_SCRIPT_INICIAL.sql. Nenhum servico cria tabela, sequencia ou
    indice; mudanca de schema vai como script para o dono do banco (change banco-curvas-ajustes).
  - Nomes de tabela e coluna sao os do schema real (tCurvaMercd, cTickerIndcd, ...); as classes de
    persistencia usam o nome da tabela (CurvaMercdEntity).

  STACK E REGRAS TECNICAS (nao violar sem decisao explicita):
  - Java 21 nativo (records, sealed, switch com pattern matching, java.time, RoundingMode,
    HexFormat, virtual threads, sem synchronized) e arquitetura hexagonal (domain sem framework,
    portas em application/port, adaptadores em adapter/in e adapter/out). Spring Boot 4, Jackson 3.
  - Lombok e MapStruct so onde o codigo existente ja usa; codigo novo sem MapStruct.
  - Precisao: valor de curva e sempre BigDecimal com escala e RoundingMode explicitos, nunca
    double; no JSON, decimal como string.
  - Fuso: a JVM roda em America/Sao_Paulo; sem classe de relogio propria.
  - Insumo ausente e ausencia de dado: rejeitar nomeando curva e data, nunca estimar.
  - Blob Storage guarda so os arquivos originais dos feeders e os scripts Groovy.
  - Nao criar topico Kafka, DLQ nem tabela sem pedido explicito.
  - CDI e SELIC sao persistidos anualizados base 252.

  TESTES: fixture real sempre que existir; comparar valores exatos com o mesmo arredondamento de
  producao, sem tolerancia de double.

  IDIOMA:
  - Documentacao, specs e mensagens ao usuario: portugues do Brasil, com acentuacao, UTF-8.
  - Codigos (enums, codigos de erro e aviso) nao se traduzem.
