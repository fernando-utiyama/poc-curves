server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring:
  application:
    name: curve-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/curvas/protocol/openid-connect/certs}

services:
  curve-api:
    url: ${CURVE_API_URL:http://localhost:8082}
    timeout-seconds: 5
  curve-engine:
    url: ${CURVE_ENGINE_URL:http://localhost:8083}
    timeout-seconds: 3
  curve-orchestrator:
    url: ${CURVE_ORCHESTRATOR_URL:http://localhost:8084}
    timeout-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
