        semDado:
          type: integer
        falhas:
          type: integer
        pendentes:
          type: integer
        status:
          type: string
          enum: [EM_ANDAMENTO, CONCLUIDO, INTERROMPIDO]

    ExecucoesResponse:
      type: object
      required: [itens, totalItens, pagina, tamanho]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemExecucaoDTO'
        totalItens:
          type: integer
        pagina:
          type: integer
        tamanho:
          type: integer

    ItemExecucaoDTO:
      type: object
      required: [id, correlationId, alvo, dataReferencia, tipoDisparo, estado, disparadoEm]
      properties:
