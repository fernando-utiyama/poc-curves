          type: string
          enum: [ABERTO, EM_REPROCESSAMENTO, RESOLVIDO, DESCARTADO, OBSOLETO]

    PendenciasDlqDetalheResponse:
      type: object
      required: [grupoId, itens]
      properties:
        grupoId:
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPendenciaDlqDTO'

    ItemPendenciaDlqDTO:
      type: object
      required: [id, idEvento, correlationId, topicoOrigem, particao, offset, falhouEm, motivo]
      properties:
        id:
          type: string
        idEvento:
          type: string
        correlationId:
          type: string
        topicoOrigem:
          type: string
        particao:
          type: integer
        offset:
          type: integer
        falhouEm:
          type: string
          format: date-time
        motivo:
          type: string
        detalhe:
          type: string
