        totalAfetadas:
          type: integer
        mensagem:
          type: string

    ModelosResponse:
      type: object
      required: [modelos]
      properties:
        modelos:
          type: array
          items:
            $ref: '#/components/schemas/ModeloDTO'

    ModeloDTO:
      type: object
      required: [id, nome, tipo, estado, checksum]
      properties:
        id:
          type: string
        nome:
          type: string
        tipo:
          type: string
          enum: [BUILTIN, GROOVY]
        estado:
          type: string
          enum: [ATIVO, DESABILITADO]
        checksum:
          type: string
        descricao:
          type: string
