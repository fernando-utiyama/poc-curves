    ImportarModeloGroovyRequest:
      type: object
      required: [nome, scriptConteudo, descricao]
      properties:
        nome:
          type: string
        scriptConteudo:
          type: string
        descricao:
          type: string

    TrocarModeloCurvaRequest:
      type: object
      required: [modeloId]
      properties:
        modeloId:
          type: string

  responses:
    Unauthorized:
      description: Token ausente, expirado ou inválido
      content:
        application/json:
          schema:
            type: object
            required: [codigoErro, mensagem]
            properties:
              codigoErro:
                type: string
                example: UNAUTHORIZED
              mensagem:
                type: string
                example: Sessão inválida ou expirada.

    Forbidden:
      description: Usuário não tem permissão para executar esta operação
      content:
        application/json:
          schema:
            type: object
            required: [codigoErro, mensagem, perfilNecessario]
            properties:
              codigoErro:
                type: string
                example: FORBIDDEN
              mensagem:
                type: string
                example: Operação restrita a perfis superiores.
              perfilNecessario:
                type: string

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            required: [codigoErro, mensagem]
            properties:
              codigoErro:
                type: string
              mensagem:
                type: string

    BadRequest:
      description: Requisição inválida ou incoerente
      content:
        application/json:
          schema:
            type: object
            required: [codigoErro, mensagem]
            properties:
              codigoErro:
                type: string
              mensagem:
                type: string
