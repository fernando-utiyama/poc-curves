        correlationId:
          type: string
        alvo:
          type: string
        dataReferencia:
          type: string
          format: date
        momento:
          type: string
        tipoDisparo:
          type: string
        faixa:
          type: string
        disparadoPor:
          type: string
        estado:
          type: string
          enum: [PENDENTE, EXECUTANDO, CONSTRUINDO, CONCLUIDA, SEM_DADO, FALHOU, EM_RISCO, ATRASADA]
        etapaAtual:
          type: string
        duracaoSegundos:
          type: integer
        tentativa:
          type: integer
        causaFalha:
          type: string
        disparadoEm:
          type: string
          format: date-time

    PendenciasDlqGruposResponse:
      type: object
      required: [grupos]
      properties:
        grupos:
          type: array
          items:
            $ref: '#/components/schemas/GrupoPendenciaDlqDTO'

    GrupoPendenciaDlqDTO:
      type: object
      required: [grupoId, motivo, fonte, conjuntoDados, dataReferencia, totalMensagens, primeiraFalhaEm, ultimaFalhaEm, estado]
      properties:
        grupoId:
          type: string
        motivo:
          type: string
        fonte:
          type: string
        conjuntoDados:
          type: string
        dataReferencia:
          type: string
          format: date
        totalMensagens:
          type: integer
        primeiraFalhaEm:
          type: string
          format: date-time
        ultimaFalhaEm:
          type: string
          format: date-time
