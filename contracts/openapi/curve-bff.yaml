        datasets:
          type: array
          items:
            type: string
            enum: [PR_DI1, BVBG_086, BVBG_028, TAXAS_REFERENCIA]
        limiteConcorrencia:
          type: integer
          default: 3

    BackfillStatusResponse:
      type: object
      required: [id, totalDias, concluidos, semDado, falhas, pendentes, status]
      properties:
