openapi: 3.0.3
info:
  title: Curve BFF API
  version: 1.0.0
  description: >-
    Backend-for-Frontend (BFF) da Plataforma de Curvas de Tesouraria/Risco.
    Única superfície exposta ao navegador (curve-web-ui).
    Todos os valores de mercado trafegam como texto numérico (string) para preservação de precisão.
servers:
  - url: /api/v1
    description: URL base relativa do BFF

paths:
  /painel-do-dia:
    get:
      summary: Painel do dia
      description: Retorna o status de todas as curvas ativas para a data de referência.
      operationId: getPainelDoDia
      parameters:
        - name: dataReferencia
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Data no formato YYYY-MM-DD (default é hoje)
      responses:
        '200':
          description: Lista de status das curvas no painel do dia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PainelDoDiaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alertas/sumario:
    get:
      summary: Alerta leve global
      description: Retorna sumário leve de pendências DLQ e execuções em risco para exibição no header global.
      operationId: getAlertasSumario
      responses:
        '200':
          description: Sumário de alertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertasSumarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /catalogo:
    get:
      summary: Catálogo de curvas
      description: Lista as definições de curvas cadastradas com paginação e filtros.
      operationId: getCatalogo
      parameters:
        - name: codigo
          in: query
          schema:
            type: string
        - name: modoOrigem
          in: query
          schema:
            type: string
            enum: [BOOTSTRAPPED, IMPORTED]
        - name: estado
          in: query
          schema:
            type: string
            enum: [RASCUNHO, ATIVA, APOSENTADA]
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista paginada de definições de curva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /curvas/{codigo}/definicao:
    get:
      summary: Consulta a definição de uma curva
      operationId: getDefinicaoCurva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Definição da curva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinicaoCurvaDTO'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Cadastra nova definição de curva (Admin)
      operationId: criarDefinicaoCurva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarOuAtualizarDefinicaoCurvaRequest'
      responses:
        '201':
          description: Curva criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinicaoCurvaDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Atualiza definição de curva gerando nova versão (Admin)
      operationId: atualizarDefinicaoCurva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarOuAtualizarDefinicaoCurvaRequest'
      responses:
        '200':
          description: Versão de definição atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinicaoCurvaDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /curvas/{codigo}/modelo-carga:
    get:
      summary: Download do template de carga manual
      operationId: downloadModeloCarga
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
        - name: formato
          in: query
          required: true
          schema:
            type: string
            enum: [CSV, XLSX]
      responses:
        '200':
          description: Arquivo template
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /curvas/{codigo}/viewer:
    get:
      summary: Tela de viewer de curva (agregada)
      description: Retorna a versão publicada, vértices, procedência, modelo, última execução e validação.
      operationId: getCurvaViewer
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
        - name: dataReferencia
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: momento
          in: query
          schema:
            type: string
            enum: [ABERTURA, INTRADIARIO, FECHAMENTO]
            default: FECHAMENTO
        - name: versao
          in: query
          schema:
            type: integer
        - name: asOf
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Dados agregados da curva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurvaViewerResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /curvas/{codigo}/interpolacao:
    post:
      summary: Consulta de interpolação em lote
      operationId: interpolarCurva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpolacaoRequest'
      responses:
        '200':
          description: Resultados da interpolação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpolacaoResponse'

  /curvas/{codigo}/carga-manual:
    post:
      summary: Carga manual de contingência (Operador/Admin)
      operationId: submeterCargaManual
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargaManualRequest'
      responses:
        '200':
          description: Carga processada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaManualResponse'
        '400':
          description: Erros de leitura no arquivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaManualErrosResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /comparacao:
    post:
      summary: Comparação de curvas (construída x importada ou modelo x modelo)
      operationId: compararCurvas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparacaoRequest'
      responses:
        '200':
          description: Tabela de comparação ponto a ponto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparacaoResponse'

  /ingestao/disparo:
    post:
      summary: Disparo manual de ingestão (Operador/Admin)
      operationId: dispararIngestao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisparoIngestaoRequest'
      responses:
        '202':
          description: Disparo aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisparoIngestaoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingestao/backfill:
    post:
      summary: Iniciar backfill histórico (Operador/Admin)
      operationId: iniciarBackfill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '202':
          description: Backfill iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillStatusResponse'
    get:
      summary: Status do backfill ativo
      operationId: getBackfillStatus
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillStatusResponse'

  /ingestao/backfill/{id}/interromper:
    post:
      summary: Interromper backfill (Operador/Admin)
      operationId: interromperBackfill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillStatusResponse'

  /execucoes:
    get:
      summary: Monitor de execuções
      operationId: getExecucoes
      parameters:
        - name: curva
          in: query
          schema:
            type: string
        - name: dataReferencia
          in: query
          schema:
            type: string
            format: date
        - name: estado
          in: query
          schema:
            type: string
            enum: [PENDENTE, EXECUTANDO, CONSTRUINDO, CONCLUIDA, SEM_DADO, FALHOU, EM_RISCO, ATRASADA]
        - name: correlationId
          in: query
          schema:
            type: string
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de execuções
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecucoesResponse'

  /execucoes/{id}/redisparar:
    post:
      summary: Redisparo prioritário de execução (Operador/Admin)
      operationId: redispararExecucao
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Redisparo aceito na faixa prioritária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisparoIngestaoResponse'

  /pendencias-dlq:
    get:
      summary: Listagem de grupos de pendências de Dead-Letter (DLQ)
      operationId: getPendenciasDlqGrupos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendenciasDlqGruposResponse'

  /pendencias-dlq/grupos/{grupoId}:
    get:
      summary: Detalhe das pendências de um grupo DLQ
      operationId: getPendenciasDlqDetalhes
      parameters:
        - name: grupoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendenciasDlqDetalheResponse'

  /pendencias-dlq/reprocessar:
    post:
      summary: Reprocessar pendência ou grupo DLQ (Operador/Admin)
      operationId: reprocessarPendenciasDlq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessarDlqRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcaoDlqResponse'

  /pendencias-dlq/descartar:
    post:
      summary: Descartar pendência ou grupo DLQ com justificativa obrigatória (Operador/Admin)
      operationId: descartarPendenciasDlq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescartarDlqRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcaoDlqResponse'

  /modelos:
    get:
      summary: Lista catálogo de modelos de cálculo (Builtin / Groovy)
      operationId: getModelos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelosResponse'
    post:
      summary: Importar modelo Groovy (Admin)
      operationId: importarModeloGroovy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportarModeloGroovyRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeloDTO'
        '400':
          $ref: '#/components/responses/BadRequest'

  /curvas/{codigo}/trocar-modelo:
    post:
      summary: Apontar curva para outro modelo de cálculo (Admin)
      operationId: trocarModeloCurva
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocarModeloCurvaRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinicaoCurvaDTO'

components:
  schemas:
    PainelDoDiaResponse:
      type: object
      required: [dataReferencia, itens]
      properties:
        dataReferencia:
          type: string
          format: date
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPainelDoDiaDTO'

    ItemPainelDoDiaDTO:
      type: object
      required: [codigoCurva, nomeCurva, modoOrigem, estado, horarioLimite]
      properties:
        codigoCurva:
          type: string
        nomeCurva:
          type: string
        modoOrigem:
          type: string
          enum: [BOOTSTRAPPED, IMPORTED]
        origemPublicacao:
          type: string
          enum: [CALCULADA, IMPORTADA, CARREGADA]
        estado:
          type: string
          enum: [NAO_INICIADA, EM_ANDAMENTO, EM_RISCO, ATRASADA, PUBLICADA, PUBLICADA_COM_AVISO, REPROVADA]
        horarioLimite:
          type: string
        tempoRestanteOuMargem:
          type: string
        etapaAtual:
          type: string
        horarioPrevisto:
          type: string
        versaoVigente:
          type: integer
        avisosValidacao:
          type: array
          items:
            type: string
        testesReprovados:
          type: array
          items:
            type: string

    AlertasSumarioResponse:
      type: object
      required: [gruposPendentesDlq, totalMensagensDlq, idadeMaisAntigaMinutos, curvasEmRisco, curvasAtrasadas]
      properties:
        gruposPendentesDlq:
          type: integer
        totalMensagensDlq:
          type: integer
        idadeMaisAntigaMinutos:
          type: integer
        severidadeDlq:
          type: string
          enum: [NORMAL, ALERTA, CRITICA]
        curvasEmRisco:
          type: integer
        curvasAtrasadas:
          type: integer

    CatalogoResponse:
      type: object
      required: [itens, totalItens, pagina, tamanho]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemCatalogoDTO'
        totalItens:
          type: integer
        pagina:
          type: integer
        tamanho:
          type: integer

    ItemCatalogoDTO:
      type: object
      required: [codigo, nome, moeda, modoOrigem, estado, versaoVigente, modeloApontado]
      properties:
        codigo:
          type: string
        nome:
          type: string
        moeda:
          type: string
        modoOrigem:
          type: string
          enum: [BOOTSTRAPPED, IMPORTED]
        estado:
          type: string
          enum: [RASCUNHO, ATIVA, APOSENTADA]
        versaoVigente:
          type: integer
        modeloApontado:
          type: string

    DefinicaoCurvaDTO:
      type: object
      required: [codigo, nome, moeda, modoOrigem, estado, versaoNumero, contagemDias, calendario, interpolador, politicaExtrapolacao, politicaArredondamento, horarioLimitePublicacao]
      properties:
        codigo:
          type: string
        nome:
          type: string
        moeda:
          type: string
        modoOrigem:
          type: string
          enum: [BOOTSTRAPPED, IMPORTED]
        estado:
          type: string
          enum: [RASCUNHO, ATIVA, APOSENTADA]
        versaoNumero:
          type: integer
        contagemDias:
          type: string
          enum: [DU_252, ACT_360, ACT_365]
        calendario:
          type: string
          enum: [B3_ANBIMA, CORRIDO]
        interpolador:
          type: string
          enum: [FLAT_FORWARD, LINEAR, LOG_LINEAR, LOG_CUBIC, NATURAL_CUBIC_SPLINE, MONOTONIC_CONVEX, FLAT_FORWARD_LINEAR]
        politicaExtrapolacao:
          type: string
          enum: [STRICT, FLAT_RATE, FLAT_FORWARD, FLAT_FORWARD_LINEAR]
        politicaArredondamento:
          type: string
          enum: [TRUNCATE_8, TRUNCATE_12, HALF_UP_8, HALF_UP_12]
        modeloApontado:
          type: string
        horarioLimitePublicacao:
          type: string
        orcamentoPorEtapaMinutos:
          type: object
          additionalProperties:
            type: integer
        janelaBloqueioMinutos:
          type: integer
        limitesValidacao:
          type: array
          items:
            $ref: '#/components/schemas/LimiteValidacaoDTO'
        vinculosFonte:
          type: array
          items:
            type: string
        dependencias:
          type: array
          items:
            type: string

    LimiteValidacaoDTO:
      type: object
      required: [testeId, classificacao, habilitado]
      properties:
        testeId:
          type: string
        classificacao:
          type: string
          enum: [BLOQUEANTE, AVISO]
        habilitado:
          type: boolean
        limiteMinimo:
          type: string
        limiteMaximo:
          type: string

    CriarOuAtualizarDefinicaoCurvaRequest:
      type: object
      required: [nome, moeda, modoOrigem, contagemDias, calendario, interpolador, politicaExtrapolacao, politicaArredondamento, horarioLimitePublicacao]
      properties:
        nome:
          type: string
        moeda:
          type: string
        modoOrigem:
          type: string
          enum: [BOOTSTRAPPED, IMPORTED]
        contagemDias:
          type: string
          enum: [DU_252, ACT_360, ACT_365]
        calendario:
          type: string
          enum: [B3_ANBIMA, CORRIDO]
        interpolador:
          type: string
          enum: [FLAT_FORWARD, LINEAR, LOG_LINEAR, LOG_CUBIC, NATURAL_CUBIC_SPLINE, MONOTONIC_CONVEX, FLAT_FORWARD_LINEAR]
        politicaExtrapolacao:
          type: string
          enum: [STRICT, FLAT_RATE, FLAT_FORWARD, FLAT_FORWARD_LINEAR]
        politicaArredondamento:
          type: string
          enum: [TRUNCATE_8, TRUNCATE_12, HALF_UP_8, HALF_UP_12]
        modeloApontado:
          type: string
        horarioLimitePublicacao:
          type: string
        orcamentoPorEtapaMinutos:
          type: object
          additionalProperties:
            type: integer
        janelaBloqueioMinutos:
          type: integer
        limitesValidacao:
          type: array
          items:
            $ref: '#/components/schemas/LimiteValidacaoDTO'
        vinculosFonte:
          type: array
          items:
            type: string
        dependencias:
          type: array
          items:
            type: string

    CurvaViewerResponse:
      type: object
      required: [codigoCurva, nomeCurva, dataReferencia, momento, versao, estadoVersao, vertices, secaoDegradada]
      properties:
        codigoCurva:
          type: string
        nomeCurva:
          type: string
        dataReferencia:
          type: string
          format: date
        momento:
          type: string
          enum: [ABERTURA, INTRADIARIO, FECHAMENTO]
        versao:
          type: integer
        isVersaoCorrente:
          type: boolean
        estadoVersao:
          type: string
          enum: [EM_VALIDACAO, PUBLICADA, PUBLICADA_COM_AVISO, SUBSTITUIDA, REPROVADA]
        origemPublicacao:
          type: string
          enum: [CALCULADA, IMPORTADA, CARREGADA]
        vertices:
          type: array
          items:
            $ref: '#/components/schemas/VerticeCurvaDTO'
        procedencia:
          $ref: '#/components/schemas/ProcedenciaCurvaDTO'
        ultimaExecucao:
          $ref: '#/components/schemas/ExecucaoResumoDTO'
        validacao:
          $ref: '#/components/schemas/ResultadoValidacaoCurvaDTO'
        secaoDegradada:
          type: object
          additionalProperties:
            type: string

    VerticeCurvaDTO:
      type: object
      required: [prazoDiasUteis, taxa]
      properties:
        prazoDiasUteis:
          type: integer
        prazoDiasCorridos:
          type: integer
        dataVencimento:
          type: string
          format: date
        taxa:
          type: string
          description: Taxa anualizada em texto decimal de alta precisão
        fatorDesconto:
          type: string
          description: Fator de desconto em texto decimal de alta precisão

    ProcedenciaCurvaDTO:
      type: object
      required: [publicadoEm]
      properties:
        publicadoEm:
          type: string
          format: date-time
        execucaoId:
          type: string
        correlationId:
          type: string
        modeloNome:
          type: string
        modeloChecksum:
          type: string
        arquivoOrigem:
          type: string
        loteIngestaoId:
          type: string
        carregadoPor:
          type: string
        justificativa:
          type: string

    ExecucaoResumoDTO:
      type: object
      required: [id, estado, tipoDisparo]
      properties:
        id:
          type: string
        correlationId:
          type: string
        estado:
          type: string
        tipoDisparo:
          type: string
        disparadoPor:
          type: string
        duracaoSegundos:
          type: integer

    ResultadoValidacaoCurvaDTO:
      type: object
      required: [statusGeral, itens]
      properties:
        statusGeral:
          type: string
          enum: [APROVADA, APROVADA_COM_AVISOS, REPROVADA]
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemValidacaoDTO'

    ItemValidacaoDTO:
      type: object
      required: [testeId, nomeTeste, classificacao, resultado]
      properties:
        testeId:
          type: string
        nomeTeste:
          type: string
        classificacao:
          type: string
          enum: [BLOQUEANTE, AVISO]
        resultado:
          type: string
          enum: [APROVADO, REPROVADO, NAO_APLICAVEL]
        medidaObservada:
          type: string
        limiteAplicado:
          type: string
        mensagem:
          type: string

    InterpolacaoRequest:
      type: object
      required: [dataReferencia, prazosDiasUteis]
      properties:
        dataReferencia:
          type: string
          format: date
        versao:
          type: integer
        momento:
          type: string
          enum: [ABERTURA, INTRADIARIO, FECHAMENTO]
        prazosDiasUteis:
          type: array
          items:
            type: integer
        interpoladorAlternativo:
          type: string

    InterpolacaoResponse:
      type: object
