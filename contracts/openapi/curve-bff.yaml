        taxaB:
          type: string
        diferencaTaxaBps:
          type: string
        fatorDescontoA:
          type: string
        fatorDescontoB:
          type: string
        status:
          type: string
          enum: [COINCIDENTE, PRESENTE_APENAS_EM_A, PRESENTE_APENAS_EM_B]

    DisparoIngestaoRequest:
      type: object
      required: [dataReferencia, datasets]
      properties:
        dataReferencia:
          type: string
          format: date
        datasets:
