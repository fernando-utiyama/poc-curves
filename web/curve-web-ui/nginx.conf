server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeçalhos de segurança — encontrado ausente na auditoria desta sessão.
    # Sem CSP explícita: os origens reais (BFF, Keycloak) variam por
    # implantação (config.json é carregado em runtime, não em build), então
    # uma CSP fixa aqui arriscaria bloquear uma implantação legítima sem
    # verificação contra um navegador real, que não foi feita nesta sessão.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy para o curve-bff — corrigido na auditoria desta sessão: não
    # existia nenhum bloco de proxy aqui, então `bffBaseUrl: "/api/v1"`
    # (caminho relativo, config.json) nunca alcançava o curve-bff de
    # verdade — toda chamada de API caía no catch-all do SPA abaixo e
    # devolvia index.html em vez de JSON.
    #
    # `proxy_pass` com host literal resolve o DNS uma vez, no start do
    # nginx — verificado de verdade rodando o container isolado: se
    # "curve-bff" não existir na rede naquele instante (ex.: container
    # ainda não subiu), o nginx inteiro recusa iniciar
    # ("host not found in upstream"). O padrão com `resolver` + variável
    # adia a resolução de DNS para o momento de cada requisição — só a
    # requisição falha (502) se o BFF estiver fora, não o servidor inteiro.
    # 127.0.0.11 é o DNS embutido do Podman/Docker nas redes definidas
    # pelo usuário (curvas-net, deploy/podman/compose.core.yaml).
    resolver 127.0.0.11 valid=30s;

    location /api/v1/ {
        set $upstream_bff http://curve-bff:8080;
        proxy_pass $upstream_bff/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control para assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.json runtime nunca deve ser cacheado
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}
